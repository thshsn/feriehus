const activityCard=a=>`<article class="activity"><div class="eyebrow">${esc(a['Kategori'])}</div><h3>${esc(a['Navn på aktivitet'])}</h3><div class="activity-meta"><span class="mini">🚗 ${esc(a['Kjøretid (ca. min)'])} min</span><span class="mini">📍 ${esc(a['Avstand (ca. km)'])}</span><span class="mini">⏱ ${esc(a['Tidsbruk'])}</span><span class="mini">👤 ${esc(a['Alder'])}</span></div><p>${esc(a['Kommentar'])}</p><div class="activity-links"><a href="${esc(a['Offisiell lenke'])}" target="_blank" rel="noopener">Gå til nettsiden ↗</a><a class="route-link" href="${esc(a['Kjørerute i Google Maps'])}" target="_blank" rel="noopener">Vis kjørerute i Google Maps ↗</a></div></article>`;
function detailHTML(h,i){const labels=`<span class="hero-labels"><span class="location-cards"><span class="country-card ${countryClass(h.country)}">${esc(h.country)}</span><span class="region-card ${countryClass(h.country)}">${esc(h.region)}</span></span><span class="house-no-card">Hus ${h.nr}</span></span>`;const hero=h.images.length?`<figure class="main"><img src="${h.images[0]}" alt="${esc(h.title)}" referrerpolicy="no-referrer">${labels}</figure><figure><img src="${h.images[1]||h.images[0]}" alt="Detaljbilde" loading="lazy" referrerpolicy="no-referrer"></figure><figure><img src="${h.images[2]||h.images[0]}" alt="Detaljbilde" loading="lazy" referrerpolicy="no-referrer"></figure>`:`<figure class="main"><div class="hero-placeholder">${esc(h.area)}</div>${labels}</figure><figure><div class="hero-placeholder small">${esc(h.country)}</div></figure><figure><div class="hero-placeholder small">${esc(h.region)}</div></figure>`;return `<div class="shell"><div class="hero">${hero}</div><div class="content"><nav class="jumpnav"><a href="#summary">🏠 Oversikt</a><a href="#area-map">🗺️ Kart</a><a href="#climate">🌤️ Klima</a><a href="#activities">🎯 Aktiviteter</a></nav><div id="summary" class="eyebrow">${esc(h.country)} · ${esc(h.region)} · ${esc(h.area)}</div><h1 class="title">${esc(h.title)}</h1><a class="house-link" href="${esc(h.url)}" target="_blank" rel="noopener">${listingLabel(h.url)} ↗</a><div class="chips">${h.facts.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div><div class="summary-grid"><p class="review">${esc(h.review)}</p><aside class="facts-card"><div class="factrow"><span>Nr.</span><strong>${h.nr}</strong></div><div class="factrow"><span>Land</span><strong>${esc(h.country)}</strong></div><div class="factrow"><span>Region</span><strong>${esc(h.region)}</strong></div><div class="factrow"><span>Sted</span><strong>${esc(h.area)}</strong></div><div class="factrow"><span>Pris</span><strong>${esc(h.price)}</strong></div></aside></div><section class="section" id="area-map"><h2>🗺️ Området på kartet</h2><iframe class="map" src="${h.map}" loading="lazy" allowfullscreen title="Kart over ${esc(h.area)}"></iframe><p class="note">Kartet markerer koordinatpunktet fra arbeidsboken.</p></section><section class="section" id="climate"><h2>🌤️ Vær og klima i juli</h2><div class="climate"><div class="metric"><div class="label">Dag</div><div class="value">${esc(h.day)} °C</div></div><div class="metric"><div class="label">Natt</div><div class="value">${esc(h.night)} °C</div></div><div class="metric"><div class="label">Høyde</div><div class="value">${esc(h.elevation)} moh.</div></div><div class="metric"><div class="label">Sol</div><div class="value">${esc(h.sun)}</div></div><div class="metric"><div class="label">Nedbør</div><div class="value climate-text">${esc(h.rain)}</div></div><div class="metric"><div class="label">Vind</div><div class="value climate-text">${esc(h.wind)}</div></div></div></section><section class="section" id="activities"><h2>🎯 Aktiviteter i området</h2><div class="activities">${h.activities.map(activityCard).join('')}</div></section></div></div>`}
function showDetail(i,push=true){index=(i+houses.length)%houses.length;document.getElementById('detail-root').innerHTML=detailHTML(houses[index],index);setView('detail');document.getElementById('counter').textContent=`Hus ${houses[index].nr} · ${houses[index].area}`;document.getElementById('bottomCounter').textContent=`${index+1} / ${houses.length}`;if(push)history.pushState(null,'',`#house-${houses[index].nr}`);window.scrollTo({top:0,behavior:'smooth'})}
function setView(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(name+'-view').classList.add('active');document.querySelectorAll('.detail-only').forEach(x=>x.style.display=name==='detail'?'':'none');document.querySelectorAll('.toplink').forEach(x=>x.classList.toggle('active',x.dataset.route===name));if(name!=='detail')document.getElementById('counter').textContent='';if(name==='map'){requestAnimationFrame(()=>requestAnimationFrame(initMap))}}
function renderList(){document.getElementById('house-list').innerHTML=houses.map((h,i)=>`<a class="house-card" href="#house-${h.nr}" data-house="${i}">${h.images.length?`<img src="${h.images[0]}" alt="${esc(h.title)}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="house-card-placeholder">${esc(h.area)}</div>`}<div class="house-card-body"><div class="card-top"><span class="badge house-list-country ${countryClass(h.country)}">${esc(h.country)}</span><span class="badge house-list-region ${countryClass(h.country)}">${esc(h.region)}</span><span class="badge house-list-no">Hus ${h.nr}</span></div><div class="eyebrow">${esc(h.country)} · ${esc(h.region)} · ${esc(h.area)}</div><h2>${esc(h.title)}</h2><p>${esc(h.price)}</p></div></a>`).join('')}
function initMap(){const el=document.getElementById('all-map');if(!el||!el.offsetWidth||!el.offsetHeight)return;if(typeof L==='undefined'){el.innerHTML='<p style="padding:20px">Kartbiblioteket kunne ikke lastes. Kontroller internettilkoblingen.</p>';return}if(mapInstance){mapInstance.invalidateSize(true);setTimeout(()=>mapInstance.invalidateSize(true),150);return}mapInstance=L.map(el,{scrollWheelZoom:true,zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap-bidragsytere'}).addTo(mapInstance);const bounds=L.latLngBounds([]);houses.forEach(h=>{const icon=L.divIcon({className:'',html:`<div class="house-marker ${countryClass(h.country)}">${h.nr}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-18]});L.marker([h.lat,h.lon],{icon}).addTo(mapInstance).bindPopup(`<p class="popup-title"><strong>Hus ${h.nr}</strong> · ${esc(h.country)}</p><div>${esc(h.region)} · ${esc(h.area)}</div><a class="popup-link" href="#house-${h.nr}">Åpne huset →</a>`);bounds.extend([h.lat,h.lon])});mapInstance.fitBounds(bounds,{padding:[50,50],maxZoom:7});setTimeout(()=>mapInstance.invalidateSize(true),150);if('ResizeObserver'in window){new ResizeObserver(()=>mapInstance&&mapInstance.invalidateSize(false)).observe(el)}}
function route(){const hash=location.hash||'#house-1';if(hash==='#all'){setView('all');window.scrollTo(0,0)}else if(hash==='#map'){setView('map');window.scrollTo(0,0)}else{const m=hash.match(/^#house-(\d+)/);const i=m?houses.findIndex(h=>h.nr===Number(m[1])):0;showDetail(i<0?0:i,false)}}
renderList();route();window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const card=e.target.closest('[data-house]');if(card){e.preventDefault();showDetail(Number(card.dataset.house))}});
const go=d=>showDetail(index+d);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('bottomPrev').onclick=()=>go(-1);document.getElementById('bottomNext').onclick=()=>go(1);
let x0=null,y0=null;document.addEventListener('touchstart',e=>{if(!document.getElementById('detail-view').classList.contains('active'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>110&&Math.abs(dx)>Math.abs(dy)*1.9)go(dx<0?1:-1);x0=y0=null},{passive:true});
</script></body></html>
