const track=document.getElementById('track');let index=0;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const activityCard=a=>`<article class="activity" data-cat="${esc(a['Kategori'])}"><div class="eyebrow">${esc(a['Kategori'])}</div><h3>${esc(a['Navn på aktivitet'])}</h3><div class="activity-meta"><span class="mini">🚗 ${esc(a['Kjøretid (min)'])} min</span><span class="mini">⏱ ${esc(a['Tidsbruk'])}</span><span class="mini">👤 ${esc(a['Alder'])}</span><span class="mini">${a['Inne/ute']==='Inne'?'🏛️':'🌿'} ${esc(a['Inne/ute'])}</span></div><p>${esc(a['Kommentar'])}</p><a href="${esc(a['Offisiell lenke'])}" target="_blank" rel="noopener">Offisiell informasjon ↗</a></article>`;
track.innerHTML=houses.map((h,i)=>`<section class="house" id="house-${i}"><div class="shell"><div class="hero"><figure class="main"><img src="${h.images[0]}" alt="${esc(h.title)}" referrerpolicy="no-referrer"><span class="hero-badge">Hus ${h.nr} · ${esc(h.type)}</span></figure><figure><img src="${h.images[1]}" alt="Detaljbilde fra huset" loading="lazy" referrerpolicy="no-referrer"></figure><figure><img src="${h.images[2]}" alt="Detaljbilde fra huset" loading="lazy" referrerpolicy="no-referrer"></figure></div><div class="content"><div class="eyebrow">${esc(h.country)} · ${esc(h.area)}</div><h1 class="title">${esc(h.title)}</h1><p class="place">${esc(h.area)}, ${esc(h.country)}</p><div class="chips">${h.facts.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div><div class="summary-grid"><p class="review">${esc(h.review)}</p><aside class="facts-card"><div class="factrow"><span>Nr.</span><strong>${h.nr}</strong></div><div class="factrow"><span>Type</span><strong>${esc(h.type)}</strong></div><div class="factrow"><span>Område</span><strong>${esc(h.area)}</strong></div><div class="factrow"><span>Land</span><strong>${esc(h.country)}</strong></div><div class="factrow"><span>Pris</span><strong>${esc(h.price)}</strong></div><a class="house-link" href="${esc(h.url)}" target="_blank" rel="noopener">Se huset hos utleier ↗</a></aside></div><section class="section"><h2>Vær og klima</h2><div class="climate"><div class="metric"><div class="label">Juli dag</div><div class="value">${esc(h.day)} °C</div></div><div class="metric"><div class="label">Juli natt</div><div class="value">${esc(h.night)} °C</div></div><div class="metric"><div class="label">Høyde</div><div class="value">${esc(h.elevation)} moh.</div></div><div class="metric"><div class="label">Vind</div><div class="value">${esc(h.wind)}</div></div></div></section><section class="section"><h2>Aktiviteter i området</h2><div class="activity-tools"><button class="active" data-filter="Alle">Alle</button><button data-filter="Regnvær">Regnvær</button><button data-filter="Varm dag">Varm dag</button></div><div class="activities">${h.activities.map(activityCard).join('')}</div></section><section class="section"><h2>Området på kartet</h2><iframe class="map" src="${h.map}" loading="lazy" allowfullscreen title="Kart over ${esc(h.area)}"></iframe><p class="note">Kartet markerer området, ikke nødvendigvis husets nøyaktige adresse.</p></section><div class="footer-nav"><button data-go="prev">← Forrige hus</button><div class="dots">${houses.map((_,d)=>`<span class="dot ${d===i?'active':''}"></span>`).join('')}</div><button data-go="next">Neste hus →</button></div></div></div></section>`).join('');
function show(n){index=(n+houses.length)%houses.length;track.style.transform=`translateX(-${index*100}vw)`;document.getElementById('counter').textContent=`${index+1} / ${houses.length} · ${houses[index].area}`;window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'',`#${encodeURIComponent(houses[index].area)}`)}
document.getElementById('prev').addEventListener('click',()=>show(index-1));document.getElementById('next').addEventListener('click',()=>show(index+1));
document.addEventListener('click',e=>{const go=e.target.dataset.go;if(go)show(index+(go==='next'?1:-1));if(e.target.matches('.activity-tools button')){const sec=e.target.closest('.section');sec.querySelectorAll('.activity-tools button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');const f=e.target.dataset.filter;sec.querySelectorAll('.activity').forEach(c=>{const txt=c.innerText;c.style.display=(f==='Alle'||txt.includes(f)|| (f==='Regnvær'&&txt.includes('Ja')))?'block':'none'});}});
let x0=null;document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)show(index+(dx<0?1:-1));x0=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});
const hash=decodeURIComponent(location.hash.slice(1));const start=houses.findIndex(h=>h.area===hash);show(start>=0?start:0);
</script>
