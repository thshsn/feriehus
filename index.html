function detailHTML(h,i){return `<div class="shell"><div class="hero"><figure class="main"><img src="${h.images[0]}" alt="${esc(h.title)}" referrerpolicy="no-referrer"><span class="hero-badge"><span class="house-no">Hus ${h.nr}</span><span class="theme">Tema: ${esc(h.type)}</span></span></figure><figure><img src="${h.images[1]}" alt="Detaljbilde" loading="lazy" referrerpolicy="no-referrer"></figure><figure><img src="${h.images[2]}" alt="Detaljbilde" loading="lazy" referrerpolicy="no-referrer"></figure></div><div class="content"><nav class="jumpnav"><a href="#summary">🏠 Oversikt</a><a href="#area-map">🗺️ Kart</a><a href="#climate">🌤️ Klima</a><a href="#activities">🎯 Aktiviteter</a></nav><div id="summary" class="eyebrow">${esc(h.country)} · ${esc(h.area)}</div><h1 class="title">${esc(h.title)}</h1><p class="place">${esc(h.area)}, ${esc(h.country)}</p><div class="chips"><span class="chip">${h.type==='Hav'?'🌊':'🌿'} ${esc(h.type)}</span>${h.facts.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div><div class="summary-grid"><p class="review">${esc(h.review)}</p><aside class="facts-card"><div class="factrow"><span>Nr.</span><strong>${h.nr}</strong></div><div class="factrow"><span>Tema</span><strong>${esc(h.type)}</strong></div><div class="factrow"><span>Område</span><strong>${esc(h.area)}</strong></div><div class="factrow"><span>Land</span><strong>${esc(h.country)}</strong></div><div class="factrow"><span>Pris</span><strong>${esc(h.price)}</strong></div><a class="house-link" href="${esc(h.url)}" target="_blank" rel="noopener">Se huset hos utleier ↗</a></aside></div><section class="section" id="area-map"><h2>🗺️ Området på kartet</h2><iframe class="map" src="${h.map}" loading="lazy" allowfullscreen title="Kart over ${esc(h.area)}"></iframe><p class="note">Kartet markerer området, ikke nødvendigvis husets nøyaktige adresse.</p></section><section class="section" id="climate"><h2>🌤️ Vær og klima</h2><div class="climate"><div class="metric"><div class="label">Juli dag</ function showDetail(i,push=true){index=(i+houses.length)%houses.length;document.getElementById('detail-root').innerHTML=detailHTML(houses[index],index);setView('detail');document.getElementById('counter').textContent=`Hus ${houses[index].nr} · ${houses[index].area}`;document.getElementById('bottomCounter').textContent=`${index+1} / ${houses.length}`;if(push)history.pushState(null,'',`#house-${houses[index].nr}`);window.scrollTo({top:0,behavior:'smooth'})}

function renderList(){document.getElementById('house-list').innerHTML=houses.map((h,i)=>`<a class="house-card" href="#house-${h.nr}" data-house="${i}"><img src="${h.images[0]}" alt="${esc(h.title)}" loading="lazy" referrerpolicy="no-referrer"><div class="house-card-body"><div class="card-top"><span class="badge">Hus ${h.nr}</span><span class="badge">Tema: ${esc(h.type)}</span></div><div class="eyebrow">${esc(h.area)} · ${esc(h.country)}</div><h2>${esc(h.title)}</h2><p>${esc(h.price)}</p></div></a>`).join('')}
function initMap(){const el=document.getElementById('all-map');if(!el||!el.offsetWidth||!el.offsetHeight)return;if(typeof L==='undefined'){el.innerHTML='<p style="padding:20px">Kartbiblioteket kunne ikke lastes. Kontroller internettilkoblingen.</p>';return}if(mapInstance){mapInstance.invalidateSize(true);setTimeout(()=>mapInstance.invalidateSize(true),150);return}mapInstance=L.map(el,{scrollWheelZoom:true,zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap-bidragsytere'}).addTo(mapInstance);const bounds=L.latLngBounds([]);houses.forEach(h=>{const icon=L.divIcon({className:'',html:`<div class="house-marker">${h.nr}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-18]});L.marker([h.lat,h.lon],{icon}).addTo(mapInstance).bindPopup(`<p class="popup-title"><strong>Hus ${h.nr}</strong> · Tema: ${esc(h.type)}</p><div>${esc(h.area)}, ${esc(h.country)}</div><a class="popup-link" href="#house-${h.nr}">Åpne huset →</a>`);bounds.extend([h.lat,h.lon])});mapInstance.fitBounds(bounds,{padding:[50,50],maxZoom:7});setTimeout(()=>mapInstance.invalidateSize(true),150);if('ResizeObserver'in window){new ResizeObserver(()=>mapInstance&&mapInstance.invalidateSize(false)).observe(el)}}
function route(){const hash=location.hash||'#house-1';if(hash==='#all'){setView('all');window.scrollTo(0,0)}else if(hash==='#map'){setView('map');window.scrollTo(0,0)}else{const m=hash.match(/^#house-(\d+)/);const i=m?houses.findIndex(h=>h.nr===Number(m[1])):0;showDetail(i<0?0:i,false)}}
renderList();route();window.addEventListener('hashchange',route);

const go=d=>showDetail(index+d);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('bottomPrev').onclick=()=>go(-1);document.getElementById('bottomNext').onclick=()=>go(1);
