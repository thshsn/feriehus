function detailHTML(h,i){const labels=`<span class="hero-labels"><span class="location-cards"><span class="country-card ${countryClass(h.country)}">${esc(h.country)}</span><span class="region-card ${countryClass(h.country)}">${esc(h.region)}</span></span><span class="house-no-card">Hus ${h.nr}</span></span>`;const hero=h.images.length?`<figure class="main"><img src="${h.images[0]}" alt="${esc(h.title)}" referrerpolicy="no-referrer">${labels}</figure><figure><img src="${h.images[1]||h.images[0]}" alt="Detaljbilde" loading="lazy" referrerpolicy="no-referrer"></figure><figure><img src="${h.images[2]||h.images[0]}" alt="Detaljbilde" loading="lazy" referrerpolicy="no-referrer"></figure>`:`<figure class="main"><div class="hero-placeholder">${esc(h.area)}</div>${labels}</figure><figure><div class="hero-placeholder small">${esc(h.country)}</div></figure><figure><div class="hero-placeholder small">${esc(h.region)}</div></figure>`;return `<div class="shell"><div class="hero">${hero}</div><div class="content"><nav class="jumpnav"><a href="#summary">🏠 Oversikt</a><a href="#area-map">🗺️ Kart</a><a href="#climate">🌤️ Klima</a><a href="#activities">🎯 Aktiviteter</a></nav><div id="summary" class="eyebrow">${esc(h.country)} · ${esc(h.region)} · ${esc(h.area)}</div><h1 class="title">${esc(h.title)}</h1><a class="house-link" href="${esc(h.url)}" target="_blank" rel="noopener">${listingLabel(h.url)} ↗</a><div class="chips">${h.facts.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div><div class="summary-grid"><p class="review">${reviewHtml(h.review)}</p><aside class="facts-card"><div class="factrow"><span>Nr.</span><strong>${h.nr}</strong></div><div class="factrow"><span>Land</span><strong>${esc(h.country)}</strong></div><div class="factrow"><span>Region</span><strong>${esc(h.region)}</strong></div><div class="factrow"><span>Sted</span><strong>${esc(h.area)}</strong></div><div class="factrow"><span>Pris</span><strong>${esc(h.price)}</strong></div></aside></div><section class=" function route(){const hash=location.hash||'#house-1';if(hash==='#all'){setView('all');window.scrollTo(0,0)}else if(hash==='#map'){setView('map');window.scrollTo(0,0)}else{const m=hash.match(/^#house-(\d+)/);const i=m?houses.findIndex(h=>h.nr===Number(m[1])):0;showDetail(i<0?0:i,false)}}
renderList();route();window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const card=e.target.closest('[data-house]');if(card){e.preventDefault();showDetail(Number(card.dataset.house))}});
const go=d=>showDetail(index+d);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('bottomPrev').onclick=()=>go(-1);document.getElementById('bottomNext').onclick=()=>go(1);
let x0=null,y0=null;document.addEventListener('touchstart',e=>{if(!document.getElementById('detail-view').classList.contains('active'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>110&&Math.abs(dx)>Math.abs(dy)*1.9)go(dx<0?1:-1);x0=y0=null},{passive:true});
</script></body></html>
